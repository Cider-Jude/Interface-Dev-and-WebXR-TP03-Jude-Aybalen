<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@c-frame/aframe-physics-system@4.2.4/dist/aframe-physics-system.min.js"></script>
    <script src="script_exercice_1.js"></script>
  </head>
  <body>
    <a-scene physics="debug: false; gravity: -15 0; friction: 0.0005; restitution: 0;" shadow="type: pcf" vr-mode-ui="enable: true">
        
        <a-light
            position="2 4 2" 
            intensity="0.8" 
            light="type:directional; 
                   castShadow:true; 
                   shadowCameraVisible: false;
                   shadow-camera-left=:-20;
                   shadow-camera-right:20;
                   shadow-camera-top:20;
                   shadow-camera-bottom:-20;
                   shadow-camera-far:50;"></a-light>

        <!-- only to test ambiant light, otherwise we need to see the shadows be casted
         <a-light
            light="type:ambient; 
                   castShadow:true;
                   color: #CCC"></a-light> -->
        
        <a-plane position="0 0 0" 
            width="100" 
            height="100" 
            color="#888888"
            rotation = "-90 0 0"
            static-body="shape: plane"
            shadow="receive: true"></a-plane>

        <a-box position="0 1 -3"
                id="cube" 
                rotation="0 0 0" 
                color="#4CC3D9"
                dynamic-body="mass: 1; linearDamping: 0.4; angularDamping: 0.95; shape: box"
                shadow="cast: true; receive: true"></a-box>

        <!-- Mur statique infranchissable -->
        <a-box position="5 1 -8" width="1" height="2" depth="4" color="#e74c3c"
                static-body="shape: box"
                shadow="cast: true; receive: true"></a-box>

        <!-- Boîte poussable, légère -->
        <a-box position="0 1 -8" width="1" height="1" depth="1" color="#f39c12"
                dynamic-body="mass: 1; linearDamping: 0.4; shape: box"
                shadow="cast: true; receive: true"></a-box>

        <!-- Boîte poussable, lourde -->
        <a-box position="-4 1 -8" width="1.5" height="1.5" depth="1.5" color="#8e44ad"
                dynamic-body="mass: 5; linearDamping: 0.4; shape: box"
                shadow="cast: true; receive: true"></a-box>

        <!-- Sphère qui roule -->
        <a-sphere position="3 1 0" radius="0.7" color="#2ecc71"
                    dynamic-body="mass: 0.5; linearDamping: 0.3; shape: sphere"
                    shadow="cast: true; receive: true"></a-sphere>

        <!-- Rampe inclinée -->
        <a-box position="0 0.5 -15" width="6" height="0.3" depth="8" 
                rotation="-15 0 0" color="#34495e"
                static-body="shape: box"
                shadow="cast: true; receive: true"></a-box>

        <!-- Cause des prblèmes avec les navigateurs <a-sky src="skybox.jpg"></a-sky> -->
        
        <!-- L'entité joueur qui prend la forme d'une sphère et avec comme enfant, la caméra et les 2 joysticks -->
        <a-entity id="rig"
                position="0 1.6 5"
                dynamic-body="mass: 1; shape: sphere; sphereRadius: 0.3; linearDamping: 0.9">

            <a-entity id="cameraRig">
                <a-entity id="camera" camera look-controls position="0 0 0"></a-entity>

                <a-entity id="leftHand"
                        oculus-touch-controls="hand: left"
                        vive-controls="hand: left"
                        windows-motion-controls="hand: left"
                        vr-turn></a-entity>

                <a-entity id="rightHand"
                        oculus-touch-controls="hand: right"
                        vive-controls="hand: right"
                        windows-motion-controls="hand: right"
                        vr-move></a-entity>
            </a-entity>
        </a-entity>
    </a-scene>
  </body>
</html>
